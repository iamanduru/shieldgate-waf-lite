name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and Check
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      APP_ENV: test
      APP_NAME: ShieldGate WAF Lite
      PORT: 8080
      HOST: 127.0.0.1
      DATABASE_URL: mysql://waf_app:waf_app_password@127.0.0.1:3306/waf
      DEFAULT_MODE: protection
      DEFAULT_PARANOIA_LEVEL: 1
      DEFAULT_BLOCKING_THRESHOLD: 8
      LOG_LEVEL: silent
      CORS_ORIGIN: http://localhost:3000

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: waf
          MYSQL_USER: waf_app
          MYSQL_PASSWORD: waf_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build